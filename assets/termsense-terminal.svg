<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TermSense terminal suggestions</title>
  <desc id="desc">A terminal window showing TermSense command suggestions with ghost text and one-line descriptions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#070b14"/>
  <circle cx="1040" cy="88" r="170" fill="#1d4ed8" opacity=".12"/>
  <circle cx="140" cy="660" r="220" fill="#0ea5e9" opacity=".08"/>

  <g filter="url(#shadow)">
    <rect x="70" y="54" width="1060" height="612" rx="22" fill="url(#bg)" stroke="#253044" stroke-width="2"/>
  </g>

  <rect x="70" y="54" width="1060" height="58" rx="22" fill="#0f172a"/>
  <rect x="70" y="90" width="1060" height="22" fill="#0f172a"/>
  <circle cx="104" cy="83" r="7" fill="#fb7185"/>
  <circle cx="128" cy="83" r="7" fill="#fbbf24"/>
  <circle cx="152" cy="83" r="7" fill="#4ade80"/>

  <text x="600" y="89" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#cbd5e1">TermSense · Bash</text>
  <rect x="940" y="71" width="153" height="28" rx="14" fill="#172554" stroke="#2563eb" stroke-width="1"/>
  <text x="1016.5" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#93c5fd">20 suggestions</text>

  <text x="104" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64748b">~/projects/termsense</text>
  <text x="104" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#4ade80">$</text>
  <text x="130" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#f8fafc">git che</text>
  <text x="220" y="193" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64748b">ckout</text>

  <rect x="100" y="219" width="1000" height="46" rx="10" fill="#1e3a8a" opacity=".72" stroke="#3b82f6" stroke-width="1"/>
  <rect x="100" y="219" width="4" height="46" rx="2" fill="url(#accent)"/>
  <text x="120" y="249" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#f8fafc">› git checkout</text>
  <text x="370" y="249" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#bfdbfe">— Switch branches or restore files</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="120" y="294" font-size="18" fill="#cbd5e1">  git check-attr</text>
    <text x="370" y="294" font-size="16" fill="#64748b">— Git subcommand</text>

    <text x="120" y="336" font-size="18" fill="#cbd5e1">  git check-ignore</text>
    <text x="370" y="336" font-size="16" fill="#64748b">— Git subcommand</text>

    <text x="120" y="378" font-size="18" fill="#cbd5e1">  git check-ref-format</text>
    <text x="370" y="378" font-size="16" fill="#64748b">— Git subcommand</text>

    <text x="120" y="420" font-size="18" fill="#cbd5e1">  git cherry-pick</text>
    <text x="370" y="420" font-size="16" fill="#64748b">— Apply an existing commit</text>

    <text x="120" y="462" font-size="18" fill="#cbd5e1">  git clone</text>
    <text x="370" y="462" font-size="16" fill="#64748b">— Copy a remote repository locally</text>

    <text x="120" y="504" font-size="18" fill="#cbd5e1">  git commit</text>
    <text x="370" y="504" font-size="16" fill="#64748b">— Record staged changes in Git history</text>

    <text x="120" y="546" font-size="18" fill="#cbd5e1">  git diff</text>
    <text x="370" y="546" font-size="16" fill="#64748b">— Show changes between Git states</text>

    <text x="120" y="588" font-size="18" fill="#cbd5e1">  git fetch</text>
    <text x="370" y="588" font-size="16" fill="#64748b">— Download refs and objects from a remote</text>
  </g>

  <line x1="100" y1="614" x2="1100" y2="614" stroke="#243044"/>
  <text x="104" y="642" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">↑↓ select</text>
  <text x="220" y="642" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">Tab / → accept</text>
  <text x="390" y="642" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">Esc dismiss</text>
  <text x="520" y="642" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748b">Ctrl+Space browse all commands</text>

  <text x="1090" y="642" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#38bdf8">local-first · offline</text>
</svg>
