[package]
name = "termsense"
version = "0.1.0"
edition = "2021"
description = "Context-aware inline command suggestions for Linux terminals"
license = "MIT"
repository = "https://github.com/Anuppaul/termsense"
keywords = ["linux", "terminal", "shell", "autocomplete", "bash"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
